<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Game</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Main menu -->
        <div id="mainMenu" class="ui-panel active">
            <h1>Main Menu</h1>
            <button id="playBtn">Play</button>
            <div style="margin-top: 20px; font-size: 12px">
                <div>Use arrow keys to move the player.</div>
                <div>Press 'Esc' to pause the game.</div>
            </div>
        </div>
        <!-- Pause menu -->
        <div id="pauseMenu" class="ui-panel">
            <h2>Paused</h2>
            <button id="resumeBtn">Resume</button>
            <button id="quitBtn">Main Menu</button>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
